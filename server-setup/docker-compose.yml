# Kein Dienst veröffentlicht Ports. Anfragen aus dem Internet kommen über den
# Cloudflare Tunnel, den der Server selbst nach außen aufbaut.
services:
  tunnel:
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    mem_limit: 128m
    networks:
      - edge

  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION}
    restart: unless-stopped
    command: start
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HOSTNAME: https://${AUTH_DOMAIN}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1536m
    networks:
      - edge
      - db

  # Startet erst mit "--profile api", sobald das Image gebaut ist.
  api:
    profiles: ["api"]
    image: ${API_IMAGE}
    restart: unless-stopped
    environment:
      # Namen an die eigene API anpassen.
      DATABASE_URL: postgres://app:${APP_DB_PASSWORD}@postgres:5432/app
      OIDC_ISSUER: https://${AUTH_DOMAIN}/realms/${KC_REALM}
      PORT: ${API_PORT}
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 768m
    networks:
      - edge
      - db

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 768m
    networks:
      - db

networks:
  edge:
  db:
    internal: true

volumes:
  postgres_data:

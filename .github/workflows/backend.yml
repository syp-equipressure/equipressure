name: Backend

on:
  push:
    branches: [ main, dev ]
    paths: [ 'backend/**', '.github/workflows/backend.yml' ]
  pull_request:
    branches: [ main, dev ]
    paths: [ 'backend/**', '.github/workflows/backend.yml' ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'

defaults:
  run:
    working-directory: backend/api

jobs:
  build-and-unit-tests:
    name: Format check, build & unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore --exclude EquiApi.Persistence/Migrations

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test --project EquiApi.Test/EquiApi.Test.csproj --configuration Release --no-build

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: build-and-unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build
        run: dotnet build --configuration Release

      # Testcontainers uses the Docker daemon that is preinstalled on the GitHub runners
      - name: Run integration tests
        run: dotnet test --project EquiApi.TestInt/EquiApi.TestInt.csproj --configuration Release --no-build

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: integration-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: backend/api
          push: false
          tags: equiapi:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

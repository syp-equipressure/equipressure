name: Backend

on:
  push:
    branches: [ main, dev ]
    paths: [ 'backend/**', 'server-setup/database/**', '.github/workflows/backend.yml' ]
  pull_request:
    branches: [ main, dev ]
    paths: [ 'backend/**', 'server-setup/database/**', '.github/workflows/backend.yml' ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  IMAGE: ghcr.io/syp-equipressure/equipressure-api

defaults:
  run:
    working-directory: backend/api

jobs:
  build-and-unit-tests:
    name: Format check, build & unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore --exclude EquiApi.Persistence/Migrations

      # Production does not migrate on startup, the server applies schema.sql when it deploys
      - name: Check schema.sql contains the latest migration
        run: |
          latest=$(ls EquiApi.Persistence/Migrations/2*.cs | grep -v Designer | sort | tail -1 | xargs basename -s .cs)
          grep -q "$latest" ../../server-setup/database/schema.sql \
            || { echo "::error::schema.sql is missing $latest, regenerate it"; exit 1; }

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test --project EquiApi.Test/EquiApi.Test.csproj --configuration Release --no-build

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: build-and-unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build
        run: dotnet build --configuration Release

      # Testcontainers uses the Docker daemon that is preinstalled on the GitHub runners
      - name: Run integration tests
        run: dotnet test --project EquiApi.TestInt/EquiApi.TestInt.csproj --configuration Release --no-build

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: integration-tests
    permissions:
      contents: read
      packages: write
    # the newest push wins, the server deploys whatever is tagged latest
    concurrency: deploy-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only pushes to main and dev publish an image, server-setup/deploy.sh picks it up from there
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: backend/api
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE }}:latest,${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: Frontend

on:
  push:
    branches: [ main, dev ]
    paths: [ 'sattler_frontend/**', '.github/workflows/frontend.yml' ]
  pull_request:
    branches: [ main, dev ]
    paths: [ 'sattler_frontend/**', '.github/workflows/frontend.yml' ]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/syp-equipressure/equipressure-sattler

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sattler_frontend/package-lock.json

      - name: Install dependencies
        working-directory: sattler_frontend
        run: npm ci

      # Ubuntu blocks the Chrome sandbox on the GitHub runners by default
      - name: Allow the Chrome sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run unit tests
        working-directory: sattler_frontend
        run: npx ng test --watch=false --browsers=ChromeHeadless

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: unit-tests
    permissions:
      contents: read
      packages: write
    # the newest push wins, the server deploys whatever is tagged latest
    concurrency: deploy-sattler

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only pushes to main and dev publish an image, server-setup/deploy.sh picks it up from there
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: sattler_frontend
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE }}:latest,${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

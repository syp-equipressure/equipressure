<div class="app-shell">
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>

  @if (sidenav.open()) {
    <button
      class="backdrop"
      type="button"
      aria-label="Menü schließen"
      (click)="sidenav.hide()"
    ></button>
  }

  <aside class="drawer" [class.drawer-open]="sidenav.open()">
    <app-sidenav (close)="sidenav.hide()"></app-sidenav>
  </aside>

  <main class="workspace">
    <router-outlet></router-outlet>
  </main>
</div>

<header class="page-header" [class.with-back]="showBack">
  <div class="left">
    @if (showBack) {
      <button class="back-btn" (click)="back()">
        <span class="material-icons">arrow_back</span>
        <span>Zurück</span>
      </button>
    } @else if (showMenu) {
      <button class="icon-btn" (click)="openMenu()" [attr.aria-label]="sidenavOpenLabel" [attr.aria-expanded]="sidenavIsOpen">
        <span class="material-icons">{{ sidenavIsOpen ? 'menu_open' : 'menu' }}</span>
      </button>
    }
  </div>

  <div class="center">
    <h1 class="title">{{ title }}</h1>
    @if (subtitle) {
      <a class="subtitle" [href]="'mailto:' + subtitle">{{ subtitle }}</a>
    }
  </div>

  <div class="right">
    <div class="account-info">
      <strong>{{ accountName }}</strong>
      <span>{{ accountEmail }}</span>
    </div>
    <a class="profile-circle" routerLink="/profile" aria-label="Sattler-Profil" [attr.aria-current]="profileActive ? 'page' : null">
      @if (avatarUrl; as url) {
        <img [src]="url" alt="" />
      } @else {
        <span class="material-icons">person</span>
      }
    </a>
    <button class="icon-btn" type="button" (click)="logout()" aria-label="Abmelden" title="Abmelden">
      <span class="material-icons">logout</span>
    </button>
  </div>
</header>

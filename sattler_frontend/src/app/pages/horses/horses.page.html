<app-page-header [title]="title()" [showBack]="true"></app-page-header>

<section class="page-body">
  @if (backendLoading()) {
    <div class="load-state" role="status">Pferde werden geladen …</div>
  } @else if (backendError()) {
    <div class="load-state error" role="alert">{{ backendError() }}</div>
  } @else {
  <div class="grid">
    @for (h of horses(); track h.id) {
      <button class="card" type="button" (click)="openHorse(h.id)">
        <div
          class="thumb"
          [style.background-image]="'url(' + h.imageUrl + ')'"
        ></div>
        <div class="info">
          <div class="name">{{ h.name }}</div>
          <div class="row">
            <span class="label">ALTER</span>
            <span class="value">{{ h.age }}</span>
          </div>
          <div class="row">
            <span class="label">RASSE</span>
            <span class="value">{{ h.breed }}</span>
          </div>
        </div>
      </button>
    }

    @if (horses().length === 0) {
      <div class="empty">Diese Person hat noch keine Pferde hinterlegt.</div>
    }
  </div>

  <button class="fab" aria-label="Neues Pferd hinzufügen" (click)="openAddHorseForm()">
    <span class="material-icons">add</span>
  </button>

  @if (showForm()) {
    <add-horse
      [ownerId]="backendOwnerId() || customer()?.id || ''"
      [backendMode]="backendMode()"
      (saved)="addHorse($event)"
      (cancelled)="showForm.set(false)"
    />
  }
  }
</section>

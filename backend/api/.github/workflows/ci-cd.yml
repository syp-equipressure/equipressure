name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

env:
  DOTNET_VERSION: '10.0.x'
  IMAGE_NAME: equiapi

jobs:
  # Job 1: Build und Unit Tests
  build-and-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Restore Dependencies
      run: dotnet restore
    
    - name: Build Solution
      run: dotnet build --configuration Release --no-restore
    
    - name: Run Unit Tests
      run: |
        dotnet test EquiApi.Test/EquiApi.Test.csproj \
          --configuration Release \
          --no-build \
          --verbosity normal \
          --collect:"XPlat Code Coverage" \
          --results-directory ./coverage
    
    - name: Upload Unit Test Coverage
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-coverage
        path: ./coverage/**/coverage.cobertura.xml
        retention-days: 7

  # Job 2: Integration Tests mit Testcontainers
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Restore Dependencies
      run: dotnet restore
    
    - name: Build Solution
      run: dotnet build --configuration Release --no-restore
    
    - name: Run Integration Tests
      run: |
        dotnet test EquiApi.TestInt/EquiApi.TestInt.csproj \
          --configuration Release \
          --no-build \
          --verbosity normal \
          --collect:"XPlat Code Coverage" \
          --results-directory ./coverage-int
      env:
        # Testcontainers braucht Docker Socket Access
        DOCKER_HOST: unix:///var/run/docker.sock
    
    - name: Upload Integration Test Coverage
      uses: actions/upload-artifact@v4
      with:
        name: integration-test-coverage
        path: ./coverage-int/**/coverage.cobertura.xml
        retention-days: 7

  # Job 3: Code Coverage Report
  code-coverage:
    name: Code Coverage Report
    runs-on: ubuntu-latest
    needs: [build-and-test, integration-tests]
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Download Unit Test Coverage
      uses: actions/download-artifact@v4
      with:
        name: unit-test-coverage
        path: ./coverage
    
    - name: Download Integration Test Coverage
      uses: actions/download-artifact@v4
      with:
        name: integration-test-coverage
        path: ./coverage-int
    
    - name: Code Coverage Summary
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: 'coverage/**/coverage.cobertura.xml'
        badge: true
        fail_below_min: false
        format: markdown
        hide_branch_rate: false
        hide_complexity: true
        indicators: true
        output: both
        thresholds: '60 80'
    
    - name: Add Coverage PR Comment
      uses: marocchino/sticky-pull-request-comment@v2
      if: github.event_name == 'pull_request'
      with:
        recreate: true
        path: code-coverage-results.md

  # Job 4: Docker Build
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [build-and-test, integration-tests]
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: false
        tags: ${{ env.IMAGE_NAME }}:${{ github.sha }},${{ env.IMAGE_NAME }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        outputs: type=docker,dest=/tmp/${{ env.IMAGE_NAME }}.tar
    
    - name: Upload Docker Image Artifact
      uses: actions/upload-artifact@v4
      with:
        name: docker-image
        path: /tmp/${{ env.IMAGE_NAME }}.tar
        retention-days: 7
    
    - name: Test Docker Image
      run: |
        docker load --input /tmp/${{ env.IMAGE_NAME }}.tar
        docker images
        echo "✅ Docker Image successfully built: ${{ env.IMAGE_NAME }}:${{ github.sha }}"

  # Job 5: PR Guard - Alle Jobs müssen erfolgreich sein
  pr-guard:
    name: PR Guard ✅
    runs-on: ubuntu-latest
    needs: [build-and-test, integration-tests, docker-build]
    if: github.event_name == 'pull_request'
    
    steps:
    - name: All Checks Passed
      run: |
        echo "🎉 All checks passed! PR is ready to merge."
        echo "✅ Build successful"
        echo "✅ Unit tests passed"
        echo "✅ Integration tests passed"
        echo "✅ Docker image built successfully"
